name: Verify Forge Workspace
on:
  push:
    branches: [main, feat/codex-workspace-byok]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q app
      - run: node --check app/static/app.js
      - run: pip install -r requirements.txt
      - name: Smoke-test application endpoints
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get('/health').status_code == 200
          assert c.get('/').status_code == 200
          assert c.get('/assets/style.css').status_code == 200
          assert c.get('/assets/app.js').status_code == 200
          assert len(c.get('/api/providers').json()) >= 5
          assert c.post('/api/agent',json={}).status_code == 422
          print('Smoke tests passed')
          PY
